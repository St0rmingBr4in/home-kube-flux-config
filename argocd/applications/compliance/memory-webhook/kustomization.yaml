---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - service.yaml
  - deployment.yaml
  - webhook-cert.yaml
  - mutating-webhook.yaml

# Image transformation - using public Docker Hub image
images:
  - name: memory-webhook
    newName: st0rmingbr4in/memory-webhook
    newTag: latest@sha256:5bc6076803638d33e7292ed37dd80c82dc5fb7b69b2d0b33ed90a2835027d672

# Common labels
labels:
  - pairs:
      app.kubernetes.io/name: memory-webhook
      app.kubernetes.io/component: admission-controller
      app.kubernetes.io/part-of: oom-prevention

# Common annotations
commonAnnotations:
  app.kubernetes.io/managed-by: argocd
