---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - service.yaml
  - deployment.yaml
  - webhook-cert.yaml
  - mutating-webhook.yaml

# Image transformation - using public Docker Hub image
images:
  - name: memory-webhook
    newName: st0rmingbr4in/memory-webhook
    newTag: latest@sha256:35df01c4c409cfcdd0cbe246b3b910e56077a75b0ed58ff852124a2aaa468f40

# Common labels
labels:
  - pairs:
      app.kubernetes.io/name: memory-webhook
      app.kubernetes.io/component: admission-controller
      app.kubernetes.io/part-of: oom-prevention

# Common annotations
commonAnnotations:
  app.kubernetes.io/managed-by: argocd
