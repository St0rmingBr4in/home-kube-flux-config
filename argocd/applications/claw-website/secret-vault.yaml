---
# Managed manually in Vault
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: claw-website
  namespace: prod-claw
spec:
  mount: secret
  path: claw-website
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: claw-website
    overwrite: true
  hmacSecretData: true
  refreshAfter: 24h
---
# Written by Terraform (terraform/authentik/claw-website.tf)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: claw-website-authentik
  namespace: prod-claw
spec:
  mount: secret
  path: authentik/claw-website
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: claw-website-authentik
    overwrite: true
  hmacSecretData: true
  refreshAfter: 24h
---
# Needs a classic read:packages PAT: GitHub App tokens can't auth to GHCR and
# fine-grained PATs are unreliable there.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: prod-claw
spec:
  mount: secret
  path: ci/ghcr-pull-secret
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: ghcr-pull-secret
    overwrite: true
    type: kubernetes.io/dockerconfigjson
  hmacSecretData: true
  refreshAfter: 24h
