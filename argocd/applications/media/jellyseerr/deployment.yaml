---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: jellyseerr
    app.kubernetes.io/instance: jellyseerr
spec:
  replicas: 1
  strategy:
    # RWO iSCSI config PVC: never mount it from two pods at once.
    type: Recreate
  selector:
    # Same selector the TrueCharts chart created (selectors are immutable).
    matchLabels:
      app.kubernetes.io/name: jellyseerr
      app.kubernetes.io/instance: jellyseerr
      pod.name: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyseerr
        app.kubernetes.io/instance: jellyseerr
        pod.name: main
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyseerr
          image: oci.trueforge.org/containerforge/jellyseerr:2.7.3@sha256:8d266530eaee828b54552981a244614bd5d8ba3dca143a779538c78e3c435e6b
          env:
            - name: TZ
              value: UTC
            - name: LOG_LEVEL
              value: info
            - name: PORT
              value: "10241"
          ports:
            - name: http
              containerPort: 10241
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /app/config
          # iSCSI stale-mount canary: fails if /app/config goes read-only.
          livenessProbe:
            exec:
              command: [sh, -c, touch /app/config/.liveness]
            initialDelaySeconds: 12
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 10241
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 500Mi
            limits:
              memory: 500Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-data
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: jellyseerr
    app.kubernetes.io/instance: jellyseerr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jellyseerr
    app.kubernetes.io/instance: jellyseerr
    pod.name: main
  ports:
    - name: main
      port: 10241
      targetPort: 10241
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: jellyseerr
    app.kubernetes.io/instance: jellyseerr
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`jellyseerr.st0rmingbr4in.com`)
      services:
        - name: jellyseerr
          port: 10241
