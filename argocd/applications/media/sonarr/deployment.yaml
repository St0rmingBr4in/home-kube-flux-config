---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/instance: sonarr
spec:
  replicas: 0
  strategy:
    # RWO iSCSI config PVC: never mount it from two pods at once.
    type: Recreate
  selector:
    # Same selector the TrueCharts chart created (selectors are immutable).
    matchLabels:
      app.kubernetes.io/name: sonarr
      app.kubernetes.io/instance: sonarr
      pod.name: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/instance: sonarr
        pod.name: main
      annotations:
        ad.datadoghq.com/exportarr.checks: '{"openmetrics":{"instances":[{"openmetrics_endpoint":"http://%%host%%:8990/metrics","namespace":"sonarr","metrics":[".*"]}]}}'
    spec:
      enableServiceLinks: false
      # uid/gid 568 owns the existing config and media files (TrueCharts default).
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sonarr
          image: oci.trueforge.org/containerforge/sonarr:4.0.17.2953@sha256:116d8a134f886619cec94c64a697bf9b6faeed319acbf5ed647ce494f889088f
          env:
            - name: TZ
              value: UTC
            - name: UMASK
              value: "0022"
            - name: SONARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: SONARR__SERVER__PORT
              value: "8989"
            - name: DOTNET_DbgEnableMiniDump
              value: "0"
          ports:
            - name: http
              containerPort: 8989
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /tv
              subPath: Series
            - name: downloads
              mountPath: /downloads
          livenessProbe:
            httpGet:
              path: /ping
              port: 8989
            initialDelaySeconds: 12
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8989
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 2Gi
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: [sonarr]
          env:
            - name: CONFIG
              value: /config/config.xml
            - name: URL
              value: http://localhost:8989
            - name: PORT
              value: "8990"
          ports:
            - name: metrics
              containerPort: 8990
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/instance: sonarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sonarr
    app.kubernetes.io/instance: sonarr
    pod.name: main
  ports:
    - name: main
      port: 8989
      targetPort: 8989
