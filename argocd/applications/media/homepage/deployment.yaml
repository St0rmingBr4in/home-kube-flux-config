---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: prod-media
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    # Same selector the TrueCharts chart created (selectors are immutable).
    matchLabels:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/instance: homepage
      pod.name: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/instance: homepage
        pod.name: main
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.12.3@sha256:cc84f2f5eb3c7734353701ccbaa24ed02dacb0d119114e50e4251e2005f3990a
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.st0rmingbr4in.com
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Homepage writes logs and default files under /app/config, so it is an
          # emptyDir with the managed files mounted over it.
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: managed-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: managed-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: managed-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: managed-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          emptyDir: {}
        - name: managed-config
          configMap:
            name: homepage-config
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: prod-media
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
    pod.name: main
  ports:
    - name: main
      port: 3000
      targetPort: 3000
