---
# ServiceAccount + Role for the Tailscale sidecar to persist its node state
# in a Kubernetes Secret (TS_KUBE_SECRET). Without persisted state the sidecar
# re-authenticates via the OAuth client on every container restart — a call to
# api.tailscale.com that fails once TS_ACCEPT_DNS has pointed resolv.conf at the
# (down) tunnel resolver, causing a crash-loop and a new qbittorrent-N device
# each time. With state persisted + TS_AUTH_ONCE the sidecar resumes from the
# saved node key (control-plane reached via bootstrap DNS), so no re-auth and no
# api.tailscale.com dependency on restart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qbittorrent-tailscale
  namespace: prod-media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qbittorrent-tailscale
  namespace: prod-media
rules:
  # containerboot creates the state Secret on first run…
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # …then reads/updates only its own state Secret thereafter.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["qbittorrent-tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qbittorrent-tailscale
  namespace: prod-media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qbittorrent-tailscale
subjects:
  - kind: ServiceAccount
    name: qbittorrent-tailscale
    namespace: prod-media
