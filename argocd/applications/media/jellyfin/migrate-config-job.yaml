---
# One-shot copy of the static iSCSI config volume onto the CSI volume. The old
# volume is mounted read-only; the Job fails unless a checksum pass finds no diff.
# Throttled (bwlimit, CPU limit): an unthrottled 7.6GB copy + checksum hung the 2GB-RAM NAS on 2026-10-25.
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-migrate-config
  namespace: prod-media
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: alpine:3.24
          command:
            - sh
            - -euc
            - |
              apk add --no-cache -q rsync
              rsync -aHAX --numeric-ids --bwlimit=20000 /old/ /new/
              rsync -aHAXc --numeric-ids --dry-run --itemize-changes /old/ /new/ > /tmp/diff
              if [ -s /tmp/diff ]; then cat /tmp/diff; exit 1; fi
              echo "old: $(find /old | wc -l) entries, new: $(find /new | wc -l) entries"
              echo COPY_VERIFIED
          volumeMounts:
            - name: old
              mountPath: /old
              readOnly: true
            - name: new
              mountPath: /new
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: jellyfin-config
            readOnly: true
        - name: new
          persistentVolumeClaim:
            claimName: jellyfin-data
