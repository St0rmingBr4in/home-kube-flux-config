---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jellyfin
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: jellyfin
            chart: jellyfin
            chartVersion: 3.2.0
            namespace: prod-media
            manifestPath: argocd/applications/media/jellyfin

  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      sources:
        - repoURL: https://jellyfin.github.io/jellyfin-helm
          chart: "{{chart}}"
          targetRevision: "{{chartVersion}}"
          helm:
            values: |
              image:
                # Pinned explicitly for reproducibility; matches chart 3.2.0 appVersion.
                tag: "10.11.8"
              # RWO iSCSI config PVC — the new pod must not start until the old one
              # releases the volume, otherwise it deadlocks on a multi-attach error.
              deploymentStrategy:
                type: Recreate
              podSecurityContext:
                # /config data is owned gid 568 (setgid dirs, group-rwx); run in that
                # group so Jellyfin can read/write the existing library.
                runAsUser: 568
                runAsGroup: 568
                fsGroup: 568
                # render/video groups for HW transcode (inert until /dev/dri exists).
                supplementalGroups:
                  - 107
                  - 44
              resources:
                # no CPU limit: software HEVC transcode needs to burst to all idle
                # cores to hit real-time. CPU is compressible; other pods stay
                # protected by their own requests. Memory stays capped.
                limits:
                  memory: 8Gi
                requests:
                  cpu: 3500m
                  memory: 8Gi
              persistence:
                config:
                  enabled: true
                  existingClaim: jellyfin-config
                media:
                  enabled: true
                  existingClaim: media-library
                  readOnly: false
                cache:
                  # disabled -> chart mounts an emptyDir at /cache (regenerable data).
                  enabled: false
              # startupProbe gates liveness/readiness until the server is serving, so
              # a slow first-boot DB migration (10.9->10.11 took ~3min) is never killed
              # by the liveness probe.
              startupProbe:
                tcpSocket: null        # drop chart default handler (deep-merge)
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
                failureThreshold: 60   # up to ~10min for a schema migration
                timeoutSeconds: 5
              # Liveness checks BOTH the iSCSI mount and HTTP health in one exec (a probe
              # may only have one handler type, so httpGet is nulled and folded in):
              #   touch /config/.liveness -> iSCSI-backed /config writable (stale-mount canary)
              #   curl /health            -> HTTP server responsive (catches a hung process)
              livenessProbe:
                httpGet: null
                exec:
                  command:
                    - sh
                    - -c
                    - touch /config/.liveness && curl -fsS -o /dev/null http://127.0.0.1:8096/health
                periodSeconds: 15
                failureThreshold: 5
                timeoutSeconds: 10
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                periodSeconds: 10
              ingress:
                enabled: true
                className: traefik
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: websecure
                  traefik.ingress.kubernetes.io/router.tls: "true"
                hosts:
                  - host: jellyfin.st0rmingbr4in.com
                    paths:
                      - path: /
                        pathType: Prefix
                # Traefik serves TLS from its default wildcard cert (same as the other
                # media apps) — no per-ingress secret needed.
                tls: []
        - repoURL: https://github.com/St0rmingBr4in/home-kube-flux-config
          targetRevision: HEAD
          path: "{{manifestPath}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
