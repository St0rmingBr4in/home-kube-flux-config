---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: radarr
spec:
  replicas: 1
  strategy:
    # RWO iSCSI config PVC: never mount it from two pods at once.
    type: Recreate
  selector:
    # Same selector the TrueCharts chart created (selectors are immutable).
    matchLabels:
      app.kubernetes.io/name: radarr
      app.kubernetes.io/instance: radarr
      pod.name: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
        app.kubernetes.io/instance: radarr
        pod.name: main
      annotations:
        ad.datadoghq.com/exportarr.checks: '{"openmetrics":{"instances":[{"openmetrics_endpoint":"http://%%host%%:7879/metrics","namespace":"radarr","metrics":[".*"]}]}}'
    spec:
      enableServiceLinks: false
      # uid/gid 568 owns the existing config and media files (TrueCharts default).
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radarr
          image: oci.trueforge.org/containerforge/radarr:6.1.2.10359@sha256:f53a013f42936d7dcde1fbcc4320ac79e6247136beca6f34e73658e981cd57a5
          env:
            - name: TZ
              value: UTC
            - name: UMASK
              value: "0022"
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: RADARR__SERVER__PORT
              value: "7878"
          ports:
            - name: http
              containerPort: 7878
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /movies
              subPath: Movies
            - name: downloads
              mountPath: /downloads
          # iSCSI stale-mount canary: fails if /config goes read-only.
          livenessProbe:
            exec:
              command: [sh, -c, touch /config/.liveness]
            initialDelaySeconds: 12
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 300Mi
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: [radarr]
          env:
            - name: CONFIG
              value: /config/config.xml
            - name: URL
              value: http://localhost:7878
            - name: PORT
              value: "7879"
          ports:
            - name: metrics
              containerPort: 7879
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-library
        - name: downloads
          persistentVolumeClaim:
            claimName: media-downloads
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: prod-media
  labels:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: radarr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: radarr
    app.kubernetes.io/instance: radarr
    pod.name: main
  ports:
    - name: main
      port: 7878
      targetPort: 7878
