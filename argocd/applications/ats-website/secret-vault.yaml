---
# App secrets (DATABASE_URL, AUTH_SECRET, Datadog RUM tokens) — managed manually in Vault
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ats-website
  namespace: prod-ats
spec:
  mount: secret
  path: ats-website
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: ats-website
    overwrite: true
  hmacSecretData: true
  refreshAfter: 24h
---
# Authentik OIDC credentials — written automatically by Terraform (terraform/authentik/ats-website.tf)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ats-website-authentik
  namespace: prod-ats
spec:
  mount: secret
  path: authentik/ats-website
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: ats-website-authentik
    overwrite: true
  hmacSecretData: true
  refreshAfter: 24h
---
# GHCR image pull secret.
# Populated from Vault secret/ci/ghcr-pull-secret, field `.dockerconfigjson`:
#   {"auths":{"ghcr.io":{"auth":"<base64(St0rmingBr4in:PAT)>"}}}
# where PAT is a *classic* GitHub PAT with only the read:packages scope, no
# expiration. GitHub App installation tokens CANNOT authenticate to GHCR
# (confirmed GitHub limitation), and fine-grained PATs are unreliable for GHCR
# — a classic read:packages PAT is the only credential that works, so this is a
# standing (non-rotating) read-only secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull-secret
  namespace: prod-ats
spec:
  mount: secret
  path: ci/ghcr-pull-secret
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: ghcr-pull-secret
    overwrite: true
    type: kubernetes.io/dockerconfigjson
  hmacSecretData: true
  refreshAfter: 24h
