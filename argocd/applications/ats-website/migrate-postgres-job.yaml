---
# One-shot copy of the static iSCSI Postgres volume onto the CSI volume. The old
# volume is mounted read-only; the Job fails unless a checksum pass finds no diff.
apiVersion: batch/v1
kind: Job
metadata:
  name: ats-postgres-migrate-data
  namespace: prod-ats
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: alpine:3.24
          command:
            - sh
            - -euc
            - |
              apk add --no-cache -q rsync
              rsync -aHAX --numeric-ids /old/ /new/
              rsync -aHAXc --numeric-ids --dry-run --itemize-changes /old/ /new/ > /tmp/diff
              if [ -s /tmp/diff ]; then cat /tmp/diff; exit 1; fi
              echo "old: $(find /old | wc -l) entries, new: $(find /new | wc -l) entries"
              echo COPY_VERIFIED
          volumeMounts:
            - name: old
              mountPath: /old
              readOnly: true
            - name: new
              mountPath: /new
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: ats-postgres
            readOnly: true
        - name: new
          persistentVolumeClaim:
            claimName: ats-postgres-data
