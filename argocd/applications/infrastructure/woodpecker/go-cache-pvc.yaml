---
# Go module + build cache for the checks pipeline's go-test step (wiped hourly by the step).
# local-path pins it to node1, where checks always runs: its clone requests more CPU than server1 has.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodpecker-go-cache
  namespace: woodpecker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
