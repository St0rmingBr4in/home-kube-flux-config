---
# Download/build caches for CI (Go, Helm charts, Terraform providers), split into locked slots
# that are emptied hourly by ci/cache-slot.sh. local-path pins it to node1, where CI always
# runs: its clone requests more CPU than server1 has.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woodpecker-ci-cache
  namespace: woodpecker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
