---
authentik:
  error_reporting:
    enabled: false

global:
  # The chart's 2026.2 line stops at 2026.2.3; app patch releases continue. Drop on the next minor.
  image:
    tag: 2026.2.7
  env:
    - name: AUTHENTIK_DISABLE_UPDATE_CHECK
      value: "true"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"
    - name: AUTHENTIK_AVATARS
      value: "gravatar,initials"
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik
          key: postgresql-password
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik
          key: secret-key

server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - authentik.st0rmingbr4in.com
worker:
  replicas: 1
  # One replica: a rolling update would need room for two workers at once.
  deploymentStrategy:
    type: Recreate
  # 2026.2 workers use ~1Gi at steady state (goauthentik/authentik#20537).
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik
    secretKeys:
      adminPasswordKey: "postgresql-password"
      userPasswordKey: "postgresql-password"
  primary:
    persistence:
      enabled: true
      existingClaim: "authentik-postgres"
    customLivenessProbe:
      exec:
        command:
          - sh
          - -c
          - touch /bitnami/postgresql/.liveness
      initialDelaySeconds: 30
      periodSeconds: 15
      failureThreshold: 5
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
