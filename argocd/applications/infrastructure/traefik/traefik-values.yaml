# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Provider configuration
providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true

deployment:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

service:
  spec:
    type: LoadBalancer
    loadBalancerClass: tailscale
  annotations:
    tailscale.com/hostname: "traefik"
    tailscale.com/proxy-class: "proxy-resources"

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP

log:
  level: INFO

accessLog:
  enabled: true
  format: json

metrics:
  prometheus:
    enabled: true
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: metrics
