---
# Pre-created so the StatefulSet's data-vault-0 claim binds to the CSI volume its data was copied to.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-vault-0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: synology-csi-iscsi-retain
  volumeName: pvc-f6a20220-b6af-4e06-8acb-3749e366cc46
