---
# SMTP credentials (magic-link login depends on this) — managed manually in Vault
# vault kv put secret/openrsvp SMTP_USERNAME=<gmail address> SMTP_PASSWORD=<gmail app password>
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openrsvp
  namespace: prod-openrsvp
spec:
  mount: secret
  path: openrsvp
  type: kv-v2
  vaultAuthRef: prod-infra/default
  destination:
    create: true
    name: openrsvp
    overwrite: true
  hmacSecretData: true
  refreshAfter: 24h
