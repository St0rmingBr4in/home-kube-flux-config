---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret-vault.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

images:
  # Fork build (St0rmingBr4in/openrsvp) — upstream 1.8.2 + the magic-link verify
  # fix (issue #5) + configurable-locale i18n (en/fr). Revert to
  # ghcr.io/yannkr/openrsvp once the verify fix ships upstream.
  - name: ghcr.io/yannkr/openrsvp
    newName: ghcr.io/st0rmingbr4in/openrsvp
    newTag: 1.8.2-fix2@sha256:be2fd5a4b029a16b25d4b6db3cb621df9ea08c4bb9d05607d17f1286760cf956

labels:
  - pairs:
      app.kubernetes.io/part-of: openrsvp

commonAnnotations:
  app.kubernetes.io/managed-by: argocd
