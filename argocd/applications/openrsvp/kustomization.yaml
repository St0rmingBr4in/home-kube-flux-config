---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret-vault.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

images:
  # Fork build (St0rmingBr4in/openrsvp) — upstream 1.8.2 + the magic-link verify
  # fix (issue #5). Revert to ghcr.io/yannkr/openrsvp once the fix ships upstream.
  - name: ghcr.io/yannkr/openrsvp
    newName: ghcr.io/st0rmingbr4in/openrsvp
    newTag: 1.8.2-fix1

labels:
  - pairs:
      app.kubernetes.io/part-of: openrsvp

commonAnnotations:
  app.kubernetes.io/managed-by: argocd
