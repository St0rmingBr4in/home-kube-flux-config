---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-service-prod-infra
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: external-service-prod-infra
            namespace: prod-infra
            manifestPath: argocd/applications/external-services/external-service-prod-infra

  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
    spec:
      project: default

      source:
        repoURL: https://github.com/St0rmingBr4in/home-kube-flux-config
        targetRevision: HEAD
        path: "{{manifestPath}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true

        retry:
          limit: 10
          backoff:
            duration: 10s
            maxDuration: 5m
            factor: 2
