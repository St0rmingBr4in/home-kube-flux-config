---
# Docker image build and push pipeline using BuildKit.
# Triggered on master pushes touching CI image source directories, or manually
# (Woodpecker UI "Run pipeline" / API) to rebuild the CI images on demand.
# Each step is skipped unless its specific image path changed.
#
# Rootless BuildKit with no process sandbox: k3s pods have a read-only cgroupfs, and the default
# AppArmor profile blocks BuildKit's bind mounts, so seccomp and AppArmor are Unconfined.
# Steps run as the image's unprivileged user; Docker Hub credentials are mounted from a Secret.
#
# For memory-webhook, a Go pre-build step compiles the binary before BuildKit runs
# (the Dockerfile does a COPY of the pre-built binary rather than a full Go toolchain).

when:
  - event: [push, pull_request]
    path:
      - "ci/images/**"
      - "memory-webhook/**"
      - "ansible/requirements.yml"
  - event: manual

# Explicit for its CPU request: the clone pod's node holds the RWO workspace for every
# later step, so it requests the heaviest step's CPU. Same image as Woodpecker's default.
clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"

steps:
  - name: build-ci-ansible
    image: moby/buildkit:v0.31.1-rootless@sha256:946cf909534b789c9b84af75e6d4f8cb23c3b9cb387daec5ba0f4878a3e4647c
    when:
      - event: push
        branch: master
        path:
          - "ci/images/ci-ansible/**"
          - "ansible/requirements.yml"
      - event: manual
    environment:
      DOCKER_CONFIG: /home/user/.docker
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    commands:
      - sh ci/step-timeout.sh 2400
      - |
        buildctl-daemonless.sh build \
          --frontend=dockerfile.v0 \
          --local context=. \
          --local dockerfile=ci/images/ci-ansible \
          --output "type=image,\"name=docker.io/st0rmingbr4in/ci-ansible:latest,docker.io/st0rmingbr4in/ci-ansible:${CI_COMMIT_SHA}\",push=true"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "2"
            memory: 256Mi
          limits:
            memory: 2Gi
        serviceAccountName: woodpecker-image-build
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/image-build"]'
        # Docker Hub credentials, synced from Vault by VSO (woodpecker-docker-config).
        secrets:
          - name: woodpecker-docker-config
            key: .dockerconfigjson
            target:
              file: /home/user/.docker/config.json
        securityContext:
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined

  - name: build-ci-terraform
    image: moby/buildkit:v0.31.1-rootless@sha256:946cf909534b789c9b84af75e6d4f8cb23c3b9cb387daec5ba0f4878a3e4647c
    when:
      - event: push
        branch: master
        path: "ci/images/ci-terraform/**"
      - event: manual
    environment:
      DOCKER_CONFIG: /home/user/.docker
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    commands:
      - sh ci/step-timeout.sh 1200
      - |
        buildctl-daemonless.sh build \
          --frontend=dockerfile.v0 \
          --local context=ci/images/ci-terraform \
          --local dockerfile=ci/images/ci-terraform \
          --output "type=image,\"name=docker.io/st0rmingbr4in/ci-terraform:latest,docker.io/st0rmingbr4in/ci-terraform:${CI_COMMIT_SHA}\",push=true"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "2"
            memory: 256Mi
          limits:
            memory: 2Gi
        serviceAccountName: woodpecker-image-build
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/image-build"]'
        # Docker Hub credentials, synced from Vault by VSO (woodpecker-docker-config).
        secrets:
          - name: woodpecker-docker-config
            key: .dockerconfigjson
            target:
              file: /home/user/.docker/config.json
        securityContext:
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined

  - name: build-ci-k8s
    image: moby/buildkit:v0.31.1-rootless@sha256:946cf909534b789c9b84af75e6d4f8cb23c3b9cb387daec5ba0f4878a3e4647c
    when:
      - event: push
        branch: master
        path: "ci/images/ci-k8s/**"
      - event: manual
    environment:
      DOCKER_CONFIG: /home/user/.docker
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    commands:
      - sh ci/step-timeout.sh 1800
      - |
        buildctl-daemonless.sh build \
          --frontend=dockerfile.v0 \
          --local context=ci/images/ci-k8s \
          --local dockerfile=ci/images/ci-k8s \
          --output "type=image,\"name=docker.io/st0rmingbr4in/ci-k8s:latest,docker.io/st0rmingbr4in/ci-k8s:${CI_COMMIT_SHA}\",push=true"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "2"
            memory: 256Mi
          limits:
            memory: 2Gi
        serviceAccountName: woodpecker-image-build
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/image-build"]'
        # Docker Hub credentials, synced from Vault by VSO (woodpecker-docker-config).
        secrets:
          - name: woodpecker-docker-config
            key: .dockerconfigjson
            target:
              file: /home/user/.docker/config.json
        securityContext:
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined

  - name: go-build-memory-webhook
    image: golang:1-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    when:
      - path: "memory-webhook/**"
    environment:
      # Single source of truth for the Go version is memory-webhook/go.mod.
      # See checks.yaml for the full rationale.
      GOTOOLCHAIN: auto
    volumes:
      - woodpecker-ci-cache:/cache
    commands:
      - sh ci/step-timeout.sh 600
      # Same slots as go-test, so the module cache is shared without two steps writing one dir.
      - . ci/cache-slot.sh go
      - export GOMODCACHE=$$CACHE_DIR/mod
      - |
        cd memory-webhook
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -a -installsuffix cgo -o webhook main.go
    backend_options:
      kubernetes:
        serviceAccountName: woodpecker-image-build
        # The memory-webhook's 512Mi default OOM-kills a full `go build -a`.
        resources:
          requests:
            cpu: "4"
            memory: 512Mi
          limits:
            memory: 2Gi
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/image-build"]'

  - name: build-memory-webhook
    image: moby/buildkit:v0.31.1-rootless@sha256:946cf909534b789c9b84af75e6d4f8cb23c3b9cb387daec5ba0f4878a3e4647c
    when:
      - event: push
        branch: master
        path: "memory-webhook/**"
    depends_on:
      - go-build-memory-webhook
    environment:
      DOCKER_CONFIG: /home/user/.docker
      BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    commands:
      - sh ci/step-timeout.sh 1200
      - |
        buildctl-daemonless.sh build \
          --frontend=dockerfile.v0 \
          --local context=memory-webhook \
          --local dockerfile=memory-webhook \
          --output "type=image,\"name=docker.io/st0rmingbr4in/memory-webhook:latest,docker.io/st0rmingbr4in/memory-webhook:${CI_COMMIT_SHA}\",push=true"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "2"
            memory: 256Mi
          limits:
            memory: 2Gi
        serviceAccountName: woodpecker-image-build
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/image-build"]'
        # Docker Hub credentials, synced from Vault by VSO (woodpecker-docker-config).
        secrets:
          - name: woodpecker-docker-config
            key: .dockerconfigjson
            target:
              file: /home/user/.docker/config.json
        securityContext:
          seccompProfile:
            type: Unconfined
          apparmorProfile:
            type: Unconfined

  - name: datadog-notify
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    when:
      - status:
          - success
          - failure
    commands:
      - sh ci/step-timeout.sh 180
      - |
        set -e
        apk add --no-cache curl jq -q
        VAULT_TOKEN=$(curl -sk \
          --data "{\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\",\"role\":\"woodpecker-notify\"}" \
          "${VAULT_ADDR}/v1/auth/kubernetes/login" \
          | jq -r '.auth.client_token')
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "Vault login failed — skipping DD notify"; exit 0; }
        DD_API_KEY=$(curl -sk -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/datadog" \
          | jq -r '.data.data.TF_VAR_datadog_api_key')
        STATUS="$CI_PIPELINE_STATUS"
        [ "$STATUS" = "failure" ] && STATUS="error"
        START_ISO=$(date -u -d "@$CI_PIPELINE_STARTED" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
        jq -n \
          --arg name "ci/image-build" \
          --arg uid "${CI_PIPELINE_NUMBER}" \
          --arg url "${CI_PIPELINE_URL}" \
          --arg start "$START_ISO" \
          --arg end "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg status "$STATUS" \
          --arg sha "$CI_COMMIT_SHA" \
          --arg branch "$CI_COMMIT_BRANCH" \
          --arg author "${CI_COMMIT_AUTHOR_EMAIL:-ci@st0rmingbr4in.com}" \
          --arg repo "$REPO_URL" \
          '{data:[{type:"cipipeline_resource_request",attributes:{provider_name:"woodpecker",resource:{level:"pipeline",unique_id:$uid,name:$name,url:$url,start:$start,end:$end,status:$status,partial_retry:false,git:{repository_url:$repo,sha:$sha,branch:$branch,author_email:$author}}}}]}' \
        | curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d @- \
            "https://api.${DD_SITE}/api/v2/ci/pipeline" \
        | xargs -I{} echo "Datadog CI API: {}"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
        serviceAccountName: woodpecker-notify
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/image-build"]'
