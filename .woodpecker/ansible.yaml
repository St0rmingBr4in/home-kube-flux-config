---
# Ansible CI pipeline: runs the playbooks on master pushes that touch their inputs.
# Linting runs for every push and PR in checks.yaml.
#
# Vault auth: Kubernetes service account JWT, one SA + same-named role per step group (terraform/vault/ci-roles.tf).
# Vault secret layout (kv-v2):
#   secret/ci/ansible   → vault_password, ssh_private_key (dedicated CI key, authorised for root on inlet + k3s nodes)
#   secret/ci/datadog   → TF_VAR_datadog_api_key (inlet only)
#   secret/inlet/socks  → password (inlet only — danted PAM auth)

when:
  - event: push
    branch: master
    path:
      - "ansible/**"
      - "ci/images/ci-ansible/**"
      - ".woodpecker/ansible.yaml"

# Never plan or deploy a commit that fails the static checks.
depends_on:
  - checks

# Explicit for its CPU request: the clone pod's node holds the RWO workspace for every
# later step, so it requests the heaviest step's CPU. Same image as Woodpecker's default.
clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.9.1@sha256:8995e4745cf57dcee659db94d43598fd181b1b370671db2c9ccf7b0b2a8f31c8
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "1"

steps:
  - name: ansible-inlet
    image: docker.io/st0rmingbr4in/ci-ansible:latest@sha256:4d4fc3430b087d80979150a9cfa4ac53acab7c433bd8bfe3b9b2a10003d3253d
    when:
      - path:
          - "ansible/ansible.cfg"
          - "ansible/scripts/**"
          - "ansible/requirements.yml"
          - "ansible/inventory/hosts.yaml"
          - "ansible/known_hosts"
          - "ansible/inventory/group_vars/inlet.yaml"
          - "ansible/roles/inlet/**"
          - "ansible/playbooks/inlet.yaml"
          - "ci/images/ci-ansible/**"
          - ".woodpecker/ansible.yaml"
    environment:
      HOME: /root
    commands:
      - sh ci/step-timeout.sh 900
      - |
        set -e
        # Retries: a fresh step pod sometimes can't reach Vault yet, which failed the whole step silently.
        VAULT_TOKEN=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          --data "{\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\",\"role\":\"woodpecker-ansible\"}" \
          "${VAULT_ADDR}/v1/auth/kubernetes/login" \
          | jq -r '.auth.client_token')
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "Vault login failed"; exit 1; }

        export ANSIBLE_VAULT_PASSWORD=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/ansible" \
          | jq -r '.data.data.vault_password')

        mkdir -p /root/.ssh && chmod 700 /root/.ssh
        curl -sSk --retry 5 --retry-all-errors --retry-delay 2 -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/ansible" \
          | jq -r '.data.data.ssh_private_key' > /root/.ssh/id_ed25519
        chmod 600 /root/.ssh/id_ed25519

        export DATADOG_API_KEY=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/datadog" \
          | jq -r '.data.data.TF_VAR_datadog_api_key')
        export SOCKS_PASSWORD=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/inlet/socks" \
          | jq -r '.data.data.password')

        # Woodpecker clones the workspace with mode 0777 — Ansible refuses
        # to load ansible.cfg from a world-writable dir, so the inventory
        # path is lost and the play matches no hosts. Tighten permissions
        # before invoking ansible-playbook.
        chmod -R go-w .
        cd ansible
        export ANSIBLE_ROLES_PATH=$(pwd)/roles:/root/.ansible/roles
        # NOTE: $$ escapes Woodpecker's own ${VAR} substitution so the shell
        # sees the variables at runtime. Plain ${VAR} would be expanded at
        # YAML-compile time (to empty) before the shell ever runs.
        # No tailscale_authkey: inlet is registered, so the role skips `tailscale up`. A key is
        # only for re-registering it, passed by hand (CLAUDE.md, "Re-provisioning the inlet VPS").
        EXTRA_VARS=""
        [ -n "$${SOCKS_PASSWORD:-}" ] && EXTRA_VARS="$$EXTRA_VARS -e socks_password=$${SOCKS_PASSWORD}"
        ansible-playbook playbooks/inlet.yaml $${EXTRA_VARS}
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "1"
        serviceAccountName: woodpecker-ansible
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/ansible"]'

  - name: ansible-k3s
    image: docker.io/st0rmingbr4in/ci-ansible:latest@sha256:4d4fc3430b087d80979150a9cfa4ac53acab7c433bd8bfe3b9b2a10003d3253d
    when:
      - path:
          - "ansible/ansible.cfg"
          - "ansible/scripts/**"
          - "ansible/requirements.yml"
          - "ansible/inventory/hosts.yaml"
          - "ansible/inventory/group_vars/k3s_cluster/**"
          - "ansible/roles/xanmanning.k3s/**"
          - "ansible/playbooks/k3s.yaml"
          - "ci/images/ci-ansible/**"
          - ".woodpecker/ansible.yaml"
    environment:
      HOME: /root
    commands:
      - sh ci/step-timeout.sh 1800
      - |
        set -e
        VAULT_TOKEN=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          --data "{\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\",\"role\":\"woodpecker-ansible\"}" \
          "${VAULT_ADDR}/v1/auth/kubernetes/login" \
          | jq -r '.auth.client_token')
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "Vault login failed"; exit 1; }

        export ANSIBLE_VAULT_PASSWORD=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/ansible" \
          | jq -r '.data.data.vault_password')

        mkdir -p /root/.ssh && chmod 700 /root/.ssh
        curl -sSk --retry 5 --retry-all-errors --retry-delay 2 -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/ansible" \
          | jq -r '.data.data.ssh_private_key' > /root/.ssh/id_ed25519
        chmod 600 /root/.ssh/id_ed25519

        # See ansible-inlet step for why this chmod is required.
        chmod -R go-w .
        cd ansible
        export ANSIBLE_ROLES_PATH=$(pwd)/roles:/root/.ansible/roles
        # Pods reach the nodes directly; drop the workstation ProxyJump via the router.
        ansible-playbook playbooks/k3s.yaml -e ansible_ssh_common_args=
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "1"
        serviceAccountName: woodpecker-ansible
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/ansible"]'

  - name: datadog-notify
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    when:
      - status:
          - success
          - failure
    commands:
      - sh ci/step-timeout.sh 180
      - |
        set -e
        apk add --no-cache curl jq -q
        VAULT_TOKEN=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 \
          --data "{\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\",\"role\":\"woodpecker-notify\"}" \
          "${VAULT_ADDR}/v1/auth/kubernetes/login" \
          | jq -r '.auth.client_token')
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "Vault login failed — skipping DD notify"; exit 0; }
        DD_API_KEY=$(curl -sSk --retry 5 --retry-all-errors --retry-delay 2 -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/datadog" \
          | jq -r '.data.data.TF_VAR_datadog_api_key')
        STATUS="$CI_PIPELINE_STATUS"
        [ "$STATUS" = "failure" ] && STATUS="error"
        START_ISO=$(date -u -d "@$CI_PIPELINE_STARTED" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
        jq -n \
          --arg name "ci/ansible" \
          --arg uid "${CI_PIPELINE_NUMBER}" \
          --arg url "${CI_PIPELINE_URL}" \
          --arg start "$START_ISO" \
          --arg end "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg status "$STATUS" \
          --arg sha "$CI_COMMIT_SHA" \
          --arg branch "$CI_COMMIT_BRANCH" \
          --arg author "${CI_COMMIT_AUTHOR_EMAIL:-ci@st0rmingbr4in.com}" \
          --arg repo "$REPO_URL" \
          '{data:[{type:"cipipeline_resource_request",attributes:{provider_name:"woodpecker",resource:{level:"pipeline",unique_id:$uid,name:$name,url:$url,start:$start,end:$end,status:$status,partial_retry:false,git:{repository_url:$repo,sha:$sha,branch:$branch,author_email:$author}}}}]}' \
        | curl -s -w "\nDatadog CI API: %{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d @- \
            "https://api.${DD_SITE}/api/v2/ci/pipeline"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
        serviceAccountName: woodpecker-notify
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/ansible"]'
