---
# Terraform CI pipeline. Triggered on master pushes that touch any terraform module.
# Modules run in parallel; each is skipped unless its module or shared CI inputs changed (step-level when.path).
# terraform/vault has no step: it manages Vault itself, so it's applied locally only.
#
# Vault auth: Kubernetes service account JWT, one SA + same-named role per step group (terraform/vault/ci-roles.tf).
# In Woodpecker 3.x WOODPECKER_BACKEND_K8S_SERVICE_ACCOUNT was removed; the SA is set
# per-step via backend_options.kubernetes.serviceAccountName.
# Vault secret layout (kv-v2):
#   secret/ci/terraform-cloud  → token   (HCP Terraform token)
#   secret/ci/<module>         → TF_VAR_* fields exported as env vars
#
# GitHub status check: posted automatically by Woodpecker forge integration.
# Datadog CI visibility: reported by the notify step at the end.

when:
  - event: [push, pull_request]
    path:
      - "terraform/**"
      - "Makefile"
      - "ci/images/ci-terraform/**"
      - ".woodpecker/terraform.yaml"

# Never plan or deploy a commit that fails the static checks.
depends_on:
  - checks

# Explicit for its CPU request: more than server1 has, so the clone lands on node1, whose
# workspace every step then follows. Same image as Woodpecker's default.
clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.9.1@sha256:8995e4745cf57dcee659db94d43598fd181b1b370671db2c9ccf7b0b2a8f31c8
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"

steps:
  - name: terraform-tfe
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:6948332413c7f7e114a754df1c23bd9684fc112286406429d2865e2fb99302dd
    when:
      - path:
          - "terraform/tfe/**"
          - "Makefile"
          - "ci/images/ci-terraform/**"
          - ".woodpecker/terraform.yaml"
    environment:
      MODULE: tfe
      # tfe module only needs the TFC token — no module-specific secrets
      VAULT_SECRET_PATH: secret/ci/terraform-cloud
    commands: &terraform_commands
      - |
        set -e
        VAULT_TOKEN=$(curl -sk \
          --data "{\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\",\"role\":\"woodpecker-tf-$MODULE\"}" \
          "${VAULT_ADDR}/v1/auth/kubernetes/login" \
          | jq -r '.auth.client_token')
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "Vault login failed"; exit 1; }
        # make and the Vault provider read VAULT_TOKEN from the environment.
        export VAULT_TOKEN

        export TF_TOKEN_APP_TERRAFORM_IO=$(curl -sk \
          -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/terraform-cloud" \
          | jq -r '.data.data.token')
        export TFE_TOKEN="$TF_TOKEN_APP_TERRAFORM_IO"

        SECRETS_API_PATH=$(echo "$VAULT_SECRET_PATH" | sed 's|^secret/|secret/data/|')
        eval "$(curl -sk \
          -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/$SECRETS_API_PATH" \
          | jq -r '.data.data | to_entries[] | "export " + .key + "=" + (.value | @sh)' 2>/dev/null || true)"

        make terraform-$MODULE-init
        make terraform-$MODULE-plan
        # Apply only on the master push (post-merge). Pull-request runs are
        # plan-only — they verify changes before the merge is gated.
        if [ "$CI_PIPELINE_EVENT" = "push" ] && [ "$CI_COMMIT_BRANCH" = "master" ]; then
          make terraform-$MODULE-apply
        fi
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        serviceAccountName: woodpecker-tf-tfe
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'

  - name: terraform-authentik
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:6948332413c7f7e114a754df1c23bd9684fc112286406429d2865e2fb99302dd
    when:
      - path:
          - "terraform/authentik/**"
          - "Makefile"
          - "ci/images/ci-terraform/**"
          - ".woodpecker/terraform.yaml"
    environment:
      MODULE: authentik
      VAULT_SECRET_PATH: secret/ci/authentik
    commands: *terraform_commands
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        serviceAccountName: woodpecker-tf-authentik
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'

  - name: terraform-datadog
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:6948332413c7f7e114a754df1c23bd9684fc112286406429d2865e2fb99302dd
    when:
      - path:
          - "terraform/datadog/**"
          - "Makefile"
          - "ci/images/ci-terraform/**"
          - ".woodpecker/terraform.yaml"
    environment:
      MODULE: datadog
      VAULT_SECRET_PATH: secret/ci/datadog
    commands: *terraform_commands
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        serviceAccountName: woodpecker-tf-datadog
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'

  - name: terraform-digitalocean
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:6948332413c7f7e114a754df1c23bd9684fc112286406429d2865e2fb99302dd
    when:
      - path:
          - "terraform/digitalocean/**"
          - "Makefile"
          - "ci/images/ci-terraform/**"
          - ".woodpecker/terraform.yaml"
    environment:
      MODULE: digitalocean
      VAULT_SECRET_PATH: secret/ci/digitalocean
    commands: *terraform_commands
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        serviceAccountName: woodpecker-tf-digitalocean
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'

  - name: terraform-tailscale
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:6948332413c7f7e114a754df1c23bd9684fc112286406429d2865e2fb99302dd
    when:
      - path:
          - "terraform/tailscale/**"
          - "Makefile"
          - "ci/images/ci-terraform/**"
          - ".woodpecker/terraform.yaml"
    environment:
      MODULE: tailscale
      VAULT_SECRET_PATH: secret/ci/tailscale
    commands: *terraform_commands
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        serviceAccountName: woodpecker-tf-tailscale
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'

  - name: terraform-woodpecker
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:6948332413c7f7e114a754df1c23bd9684fc112286406429d2865e2fb99302dd
    when:
      - path:
          - "terraform/woodpecker/**"
          - "Makefile"
          - "ci/images/ci-terraform/**"
          - ".woodpecker/terraform.yaml"
    environment:
      MODULE: woodpecker
      VAULT_SECRET_PATH: secret/ci/woodpecker-tf
    commands: *terraform_commands
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        serviceAccountName: woodpecker-tf-woodpecker
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'

  - name: datadog-notify
    # Optional: steps skipped by their path filter don't block the notification.
    depends_on:
      - name: terraform-tfe
        optional: true
      - name: terraform-authentik
        optional: true
      - name: terraform-datadog
        optional: true
      - name: terraform-digitalocean
        optional: true
      - name: terraform-tailscale
        optional: true
      - name: terraform-woodpecker
        optional: true
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    when:
      - status:
          - success
          - failure
    commands:
      - |
        set -e
        apk add --no-cache curl jq -q
        VAULT_TOKEN=$(curl -sk \
          --data "{\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\",\"role\":\"woodpecker-notify\"}" \
          "${VAULT_ADDR}/v1/auth/kubernetes/login" \
          | jq -r '.auth.client_token')
        [ -n "$VAULT_TOKEN" ] && [ "$VAULT_TOKEN" != "null" ] || { echo "Vault login failed — skipping DD notify"; exit 0; }
        DD_API_KEY=$(curl -sk -H "X-Vault-Token: $VAULT_TOKEN" \
          "${VAULT_ADDR}/v1/secret/data/ci/datadog" \
          | jq -r '.data.data.TF_VAR_datadog_api_key')
        STATUS="$CI_PIPELINE_STATUS"
        [ "$STATUS" = "failure" ] && STATUS="error"
        START_ISO=$(date -u -d "@$CI_PIPELINE_STARTED" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)
        jq -n \
          --arg name "ci/terraform" \
          --arg uid "${CI_PIPELINE_NUMBER}" \
          --arg url "${CI_PIPELINE_URL}" \
          --arg start "$START_ISO" \
          --arg end "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg status "$STATUS" \
          --arg sha "$CI_COMMIT_SHA" \
          --arg branch "$CI_COMMIT_BRANCH" \
          --arg author "${CI_COMMIT_AUTHOR_EMAIL:-ci@st0rmingbr4in.com}" \
          --arg repo "$REPO_URL" \
          '{data:[{type:"cipipeline_resource_request",attributes:{provider_name:"woodpecker",resource:{level:"pipeline",unique_id:$uid,name:$name,url:$url,start:$start,end:$end,status:$status,partial_retry:false,git:{repository_url:$repo,sha:$sha,branch:$branch,author_email:$author}}}}]}' \
        | curl -s -w "\nDatadog CI API: %{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d @- \
            "https://api.${DD_SITE}/api/v2/ci/pipeline"
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
        serviceAccountName: woodpecker-notify
        annotations:
          ad.datadoghq.com/tags: '["git.commit.sha:${CI_COMMIT_SHA}","ci.pipeline.name:ci/terraform"]'
