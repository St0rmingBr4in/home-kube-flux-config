---
# Static checks pipeline: Go tests, yamllint, tflint.
# Each step runs only when its relevant paths change.

when:
  - event: [push, pull_request]
    path:
      - "memory-webhook/**"
      - "terraform/**"
      - "**/*.yaml"
      - "**/*.yml"
      - ".yamllint.yml"
      - ".woodpecker/checks.yaml"

# Explicit for its CPU request: the clone pod's node holds the RWO workspace for every
# later step, so it requests the heaviest step's CPU. Same image as Woodpecker's default.
clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.9.1@sha256:8995e4745cf57dcee659db94d43598fd181b1b370671db2c9ccf7b0b2a8f31c8
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"

steps:
  - name: go-test
    image: golang:1-alpine
    when:
      - path:
          - "memory-webhook/**"
          - ".woodpecker/checks.yaml"
    environment:
      # Single source of truth for the Go version is memory-webhook/go.mod.
      # GOTOOLCHAIN=auto lets Go download whatever toolchain go.mod requires,
      # so the image tag only needs to be recent enough to support toolchains
      # (Go >= 1.21).
      GOTOOLCHAIN: auto
      # Limit parallelism to avoid OOM when compiling k8s.io dependencies on
      # a high-CPU node (default GOMAXPROCS equals the node's CPU count).
      GOMAXPROCS: "4"
    commands:
      - cd memory-webhook && go test ./...
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"

  - name: yamllint
    image: python:3-alpine@sha256:d44b1254cb92329418d164b22b20d86bbd3869d48e80e09e476531a409a728bb
    when:
      - path:
          - "**/*.yaml"
          - "**/*.yml"
          - ".yamllint.yml"
          - ".woodpecker/checks.yaml"
    commands:
      - pip install yamllint -q
      - yamllint -c .yamllint.yml .
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "500m"

  - name: tflint
    image: ghcr.io/terraform-linters/tflint@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359
    when:
      - path:
          - "terraform/**"
          - ".woodpecker/checks.yaml"
    commands:
      - |
        for dir in terraform/*/; do
          echo "==> $dir"
          tflint --chdir="$dir" --minimum-failure-severity=error || exit 1
        done
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "500m"
