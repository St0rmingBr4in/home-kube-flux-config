---
# Static checks pipeline: cheap, side-effect-free checks that run on every master push and PR,
# with no path filters, so a missed dependency can never skip them.
# Steps run in parallel with 100m CPU requests: a low CPU weight, so under contention
# workloads win and CI only soaks up idle CPU (see the woodpecker-ci PriorityClass).
# Memory: 128Mi requests keep six parallel steps within node1's headroom; peaks were ~450Mi.

# For pull_request, branch is the target: pushes to PR/queue branches would duplicate the PR run.
when:
  - event: [push, pull_request]
    branch: master

# Explicit for its CPU request: more than server1 has, so the clone lands on node1, whose
# local-path workspace (and Go cache) every step then follows. Same image as Woodpecker's default.
clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.9.1@sha256:8995e4745cf57dcee659db94d43598fd181b1b370671db2c9ccf7b0b2a8f31c8
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "4"

steps:
  - name: go-test
    depends_on: []
    image: golang:1-alpine@sha256:b8c9b82affbbb82a020bbcf998dad2ba9516944ac7e883524642a481a9505e9c
    environment:
      # Single source of truth for the Go version is memory-webhook/go.mod.
      # GOTOOLCHAIN=auto lets Go download whatever toolchain go.mod requires,
      # so the image tag only needs to be recent enough to support toolchains
      # (Go >= 1.21).
      GOTOOLCHAIN: auto
      # Limit parallelism to avoid OOM when compiling k8s.io dependencies on
      # a high-CPU node (default GOMAXPROCS equals the node's CPU count).
      GOMAXPROCS: "4"
    volumes:
      - woodpecker-ci-cache:/cache
    commands:
      # $$ defers expansion to the shell; Woodpecker substitutes $VAR at compile time.
      - . ci/cache-slot.sh go
      - export GOMODCACHE=$$CACHE_DIR/mod GOCACHE=$$CACHE_DIR/build
      - cd memory-webhook && go test ./...
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi

  - name: cache-slot-test
    depends_on: []
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    volumes:
      - woodpecker-ci-cache:/cache
    commands:
      - sh ci/cache-slot-test.sh
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 128Mi

  - name: yamllint
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-ansible:latest@sha256:5ded9741d6fe7828e0c5fab1d9e57ea65aedd5007a6c38d363e8498eeec15a0c
    commands:
      - yamllint -c .yamllint.yml .
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi

  - name: tflint
    depends_on: []
    image: ghcr.io/terraform-linters/tflint@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359
    commands:
      # $$ defers expansion to the shell; Woodpecker substitutes $VAR at compile time.
      - |
        for dir in terraform/*/; do
          echo "==> $$dir"
          tflint --chdir="$$dir" --minimum-failure-severity=error || exit 1
        done
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi

  - name: terraform-validate
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-terraform:latest@sha256:21f18dc5a616bf300ce1d5d2606ae27a6af0ff37bc08beef7482ddadfc6b3175
    volumes:
      - woodpecker-ci-cache:/cache
    commands:
      - . ci/cache-slot.sh terraform
      - export TF_PLUGIN_CACHE_DIR=$$CACHE_DIR
      - |
        for dir in terraform/*/; do
          echo "==> $$dir"
          terraform -chdir="$$dir" init -backend=false -input=false >/dev/null || exit 1
          terraform -chdir="$$dir" validate -no-color || exit 1
        done
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi

  - name: ansible-lint
    depends_on: []
    image: docker.io/st0rmingbr4in/ci-ansible:latest@sha256:5ded9741d6fe7828e0c5fab1d9e57ea65aedd5007a6c38d363e8498eeec15a0c
    environment:
      HOME: /root
      # Ansible rejects an empty vault password at startup; lint never decrypts, so no Vault needed.
      ANSIBLE_VAULT_PASSWORD: lint-only-dummy
    commands:
      # Ansible ignores ansible.cfg in a world-writable dir, and Woodpecker clones with 0777.
      - chmod -R go-w .
      - cd ansible && ANSIBLE_ROLES_PATH=$(pwd)/roles:/root/.ansible/roles ansible-lint --offline
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi

  # Renders every Argo CD app at this commit (fails on a broken chart or kustomization),
  # validates it with kubeconform, then renders the base commit, prints which apps' manifests
  # changed, and checks that new images exist. Secret values are redacted by the render script.
  - name: argocd-render
    depends_on: []
    # alpine/k8s plus crane (ci/images/ci-k8s), so check-images needs no download.
    image: docker.io/st0rmingbr4in/ci-k8s:latest@sha256:4126f94ff6219a67661eaf0107298c58091adf34d62e2af71924d1d7ed8ddf4a
    volumes:
      - woodpecker-ci-cache:/cache
    commands:
      - . ci/cache-slot.sh render
      - export CHART_CACHE=$$CACHE_DIR/helm && mkdir -p $$CACHE_DIR/kubeconform
      - |
        set -e
        python3 ci/argocd-render.py . /tmp/render/head
        # Removed APIs and invalid fields. CRDs come from the community catalog; ones it lacks are skipped.
        K8S=$$(sed -n 's/^k3s_release_version: "v\([0-9.]*\)+.*/\1/p' ansible/inventory/group_vars/k3s_cluster/vars.yaml)
        kubeconform -strict -summary -kubernetes-version "$$K8S" -cache "$$CACHE_DIR/kubeconform" -ignore-missing-schemas \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          /tmp/render/head
        git config --global --add safe.directory '*'
        if [ "$CI_PIPELINE_EVENT" = "pull_request" ]; then
          # Diff against the merge base, not the target tip, or master's newer commits show up reversed.
          # The clone is shallow and merge-base needs the shared history; blobs are fetched on demand.
          git fetch -q --filter=blob:none $$([ -f "$$(git rev-parse --git-dir)/shallow" ] && echo --unshallow) \
            origin "$CI_COMMIT_TARGET_BRANCH"
          BASE=$$(git merge-base FETCH_HEAD HEAD)
        else
          BASE="$CI_PREV_COMMIT_SHA"
          case "$$BASE" in
            "" | 0000000*) echo "No base commit; skipping render diff."; exec sh ci/check-images.sh /tmp/render/head ;;
          esac
          git fetch -q --depth=1 origin "$$BASE"
        fi
        if git diff --quiet "$$BASE" HEAD -- argocd ci/argocd-render.py ansible/inventory/group_vars/k3s_cluster/vars.yaml; then
          echo "No render inputs changed vs $$BASE; skipping render diff."
          exit 0
        fi
        mkdir -p /tmp/render/base-src
        git archive "$$BASE" | tar -x -C /tmp/render/base-src
        python3 ci/argocd-render.py /tmp/render/base-src /tmp/render/base \
          || echo "WARNING: base render had errors; the diff below may be incomplete."
        CHANGED=$(diff -qrN /tmp/render/base /tmp/render/head | awk '{print $$2}' | xargs -rn1 basename | sed 's/\.yaml$$//' | tr '\n' ' ')
        echo "Apps with changed manifests vs $$BASE: $${CHANGED:-none}"
        diff -ruN /tmp/render/base /tmp/render/head || true
        sh ci/check-images.sh /tmp/render/head /tmp/render/base
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "100m"
            memory: 128Mi
          limits:
            memory: 1Gi
        # Docker Hub credentials for check-images: anonymous lookups share the home IP's pull limit with the cluster.
        secrets:
          - name: woodpecker-docker-config
            key: .dockerconfigjson
            target:
              file: /root/.docker/config.json
