---
# Merge queue: a PR labelled `automerge` (Renovate adds it to minor/patch/digest/pin updates)
# enters the queue once CI is green on its own commit. Mergify then rebases it onto master,
# waits for CI on that exact commit, and merges with rebase only if it is still green.
queue_rules:
  - name: default
    # Named checks only: Mergify waits on check-success, but #check-pending never settled on its drafts.
    # terraform and image-build run only for their paths: keep these in sync with their `when: path`.
    queue_conditions:
      - label=automerge
      - &checks check-success=ci/woodpecker/pr/checks
      - &terraform
        or:
          - -files~=^(terraform/|Makefile$|ci/images/ci-terraform/|\.woodpecker/terraform\.yaml$)
          - check-success=ci/woodpecker/pr/terraform
      - &image_build
        or:
          - -files~=^(ci/images/|memory-webhook/|ansible/requirements\.yml$)
          - check-success=ci/woodpecker/pr/image-build
      # Renovate keeps this pending until a minor is 30 days old; drafts never carry it.
      - -check-pending=renovate/stability-days
    merge_conditions:
      - *checks
      - *terraform
      - *image_build
    update_method: rebase
    merge_method: rebase

pull_request_rules:
  - name: Queue PRs labelled automerge
    conditions:
      - label=automerge
    actions:
      queue:
        name: default
