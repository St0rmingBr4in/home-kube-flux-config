---
# DNS-over-TLS (dns_privacy.yaml). Reload networkd first so the cleared per-link
# resolvers take effect, then restart resolved so it picks up the DoT config and
# regenerates the stub resolv.conf.
- name: Reload systemd-networkd
  ansible.builtin.command:
    cmd: networkctl reload
  listen: "Reload systemd-networkd"

- name: Reconfigure WAN links for DNS change
  ansible.builtin.command:
    cmd: "networkctl reconfigure {{ inlet_wan_interfaces | join(' ') }}"
  listen: "Reload systemd-networkd"

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  listen: "Restart systemd-resolved"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "Reload systemd"

- name: Enable and start inlet-qos
  ansible.builtin.systemd:
    name: inlet-qos
    enabled: true
    state: started
  listen: "Enable and start inlet-qos"

- name: Apply QoS rules
  ansible.builtin.command:
    cmd: /usr/local/bin/inlet-qos.sh
  listen: "Apply QoS rules"

- name: Restart inlet-qos-watch
  ansible.builtin.systemd:
    name: inlet-qos-watch
    state: restarted
    daemon_reload: true
  listen: "Restart inlet-qos-watch"

- name: Reload systemd and restart inlet-qos-watch
  ansible.builtin.systemd:
    name: inlet-qos-watch
    state: restarted
    daemon_reload: true
  listen: "Reload systemd and restart inlet-qos-watch"

- name: Restart danted
  ansible.builtin.systemd:
    name: danted
    state: restarted
    daemon_reload: true
  listen: "Restart danted"
