---
# inlet's own iptables rules (web/torrent DNAT, MASQUERADE, FORWARD) are applied
# by a boot-time systemd oneshot ordered After=tailscaled — deliberately NOT
# persisted via netfilter-persistent. Persisting would snapshot tailscaled's
# ts-* chains and restore them stale before tailscaled starts, wedging inlet's
# outbound data path on reboot. See templates/inlet-firewall.sh.j2 for details.

- name: Warn when qbittorrent torrent IP is not configured
  ansible.builtin.debug:
    msg: >
      qbittorrent_torrent_tailscale_ip is empty — torrent port {{ torrent_port }} DNAT rules
      will be skipped. Set the variable once the Tailscale LoadBalancer service gets its IP:
        kubectl get svc -n prod-media qbittorrent-torrent \
          -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
  when: qbittorrent_torrent_tailscale_ip == ""

- name: Deploy inlet-firewall.sh (idempotent rule application)
  ansible.builtin.template:
    src: inlet-firewall.sh.j2
    dest: /usr/local/sbin/inlet-firewall.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy inlet-firewall.service (oneshot, ordered after tailscaled)
  ansible.builtin.copy:
    dest: /etc/systemd/system/inlet-firewall.service
    mode: "0644"
    content: |
      [Unit]
      Description=Apply inlet DNAT/MASQUERADE/FORWARD rules
      After=tailscaled.service network-online.target
      Wants=tailscaled.service network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/inlet-firewall.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd

- name: Ensure inlet-firewall.service is enabled
  ansible.builtin.systemd:
    name: inlet-firewall
    enabled: true
    daemon_reload: true

# Idempotent (check-then-add) — safe to run every play; applies rules immediately
# so an ansible run doesn't have to wait for the next boot.
- name: Apply inlet firewall rules now
  ansible.builtin.command:
    cmd: /usr/local/sbin/inlet-firewall.sh
  changed_when: false
