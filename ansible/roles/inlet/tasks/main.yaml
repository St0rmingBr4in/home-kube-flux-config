---
- name: Create swapfile to prevent OOM on low-memory VM
  ansible.builtin.import_tasks: swapfile.yaml

- name: Configure sysctl for IP forwarding
  ansible.builtin.import_tasks: sysctl.yaml

- name: Configure Tailscale exit node
  ansible.builtin.import_tasks: tailscale.yaml

- name: Install iptables/ipset packages
  ansible.builtin.import_tasks: iptables_packages.yaml
  tags: firewall

- name: Configure iptables NAT rules
  ansible.builtin.import_tasks: iptables_nat.yaml
  tags: firewall

- name: Configure QoS to prioritise web traffic over bulk torrent traffic
  ansible.builtin.import_tasks: qos.yaml
  tags: firewall

- name: Configure SOCKS5 proxy for tailnet apps
  ansible.builtin.import_tasks: socks.yaml

- name: Encrypt upstream DNS with DNS-over-TLS
  ansible.builtin.import_tasks: dns_privacy.yaml
  tags: dns
